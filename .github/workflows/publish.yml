name: Publish to PyPI

# Runs when you publish a GitHub release. Uses PyPI "trusted publishing" (OIDC),
# so no API token is stored anywhere. One-time setup on pypi.org: see README / release notes.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag must match the package version
        # PyPI never accepts the same version twice, so catch a forgotten version bump early
        run: |
          v=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$v" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$v'. Bump the version, commit, then re-create the release."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
