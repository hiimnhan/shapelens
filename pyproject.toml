[project]
name = "shapelens"
version = "0.1.0"
description = "See tensor shapes as boxes: trace PyTorch ops and draw them in Jupyter notebooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nhanncv" }]
requires-python = ">=3.10"
keywords = ["pytorch", "tensor", "shape", "visualization", "debugging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "torch>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/hiimnhan/shapelens"
Repository = "https://github.com/hiimnhan/shapelens"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "numpy>=2.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# single-file module: shapelens.py at the project root
[tool.hatch.build.targets.wheel]
include = ["shapelens.py"]

[tool.hatch.build.targets.sdist]
include = ["shapelens.py", "README.md", "LICENSE", "pyproject.toml"]
